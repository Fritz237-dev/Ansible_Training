---
- name: configure vlan on a switch
  hosts: switches
  gather_facts: no
  tasks:
    - name: configure vlan
      cisco.ios.ios_config:
        config:
          src: vlan_conf.j2
        state: merged
    - name: Show Vlan output
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_output

    - name: Display Vlan Output
      ansible.builtin.debug:
        msg: "{{ vlan_output.stdout_lines }}"

