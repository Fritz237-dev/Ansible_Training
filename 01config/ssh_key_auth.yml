---
- name: Gather router information using SSH key authentication
  hosts: routers
  gather_facts: no
  tasks:
    - name: Display router infomation
      cisco.ios.ios_command:
        commands:
          - show running-config
      
      register: run_cfg
    - name: Display running config
      ansible.builtin.debug:
        var: run_cfg.stdout_lines

