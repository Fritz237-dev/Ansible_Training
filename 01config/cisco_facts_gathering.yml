---
- name: Gather facts on networking devices
  hosts: routers
  gather_facts: no
  
  tasks:
    - name: gather facts from cisco devices
      cisco.ios.ios_facts:
        gather_subset:
        - min
        - interfaces

        gather_network_resources:
        - static_routes
        - l3-interfaces
      
    - name:
      builtin.debug.module:
        msg:
          - "{{ansible_net}}"
