---
- name: Gather facts on networking devices
  hosts: routers
  gather_facts: no
  
  tasks:
    - name: gather facts from cisco devices
      cisco.ios.ios_facts:
        gather_subset:
        - min
        - interfaces

        gather_network_resources:
        - static_routes
        - l3_interfaces
      register: ios_result
      
    - name: Print Configured IP addresses on Cisco devices
      ansible.builtin.debug:
        var: ansible_net_all_ipv4_addresses
