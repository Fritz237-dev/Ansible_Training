---
- name: Configure OSPF on Routers using Jinja2 template
  hosts: routers
  gather_facts: no
  tasks:
    - name: Configure OSPF
      cisco.ios.ios_config:
        backup: yes
        src: device_conf.j2
      run_once: true
    - name: Show OSPF output
      cisco.ios.ios_command:
        commands:
          - show ip route
      register: ospf_output
      notify: Save OSPF Configuration
      ansible.builtin.debug:
        msg: "{{ ospf_output}}"
  handlers:
    - name: Save OSPF Configuration
      cisco.ios.ios_config:
        save_when: always    
